<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Source Sans 3, the page's own face. The stack keeps system-ui behind it,
         so the page still reads properly before the font arrives — or at all,
         if it cannot be fetched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,300..700&amp;display=swap"
    />
    <title>KitchenSink — every ui component, on one page</title>
  </head>

  <body>
    <div id="app"></div>

    <!-- One request: app.js carries the runtime, the components and the bootstrap. -->
    <script type="module" src="build/app.js"></script>
  </body>
</html>
