<!doctype html>
<!-- The app's own browser check: `mosaic check examples/KitchenSink`.

     It loads the bundle exactly as index.html does — nothing here imports a
     module — and then drives the page the way a person would, so what is
     checked is the shipped application and not a reconstruction of it. -->

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Source Sans 3, the page's own face. The stack keeps system-ui behind it,
         so the page still reads properly before the font arrives — or at all,
         if it cannot be fetched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,300..700&amp;display=swap"
    />
    <title>KitchenSink browser check</title>
  </head>

  <body>
    <div id="app"></div>
    <pre id="results"></pre>

    <script type="module" src="build/app.js"></script>

    <script type="module">
      const log = [];
      let failed = 0;
      const check = (name, cond) => {
        log.push(`${cond ? "PASS" : "FAIL"}  ${name}`);
        if (!cond) failed++;
        // Written as they go: a page that stops halfway still says how far it got.
        document.querySelector("#results").textContent = log.join("\n");
      };

      // A module's failure arrives as a rejection, not as an error event, and a
      // page that dies quietly reads as a page that never finished.
      window.addEventListener("unhandledrejection", (e) => {
        document.querySelector("#results").textContent =
          log.join("\n") + `\nERROR  ${e.reason?.message ?? e.reason}`;
        document.title = "verdict FAIL (threw)";
      });

      window.addEventListener("error", (e) => {
        // Whatever ran before the throw is worth seeing: it says how far it got.
        document.querySelector("#results").textContent = log.join("\n");
        document.querySelector("#results").textContent +=
          `\nERROR  ${e.message}`;
        document.title = "verdict FAIL (threw)";
      });

      const app = document.querySelector("#app");
      const guard = (where, fn) => {
        try {
          return fn();
        } catch (e) {
          log.push(`ERROR  at ${where}: ${e.message}`);
          failed++;
          return null;
        }
      };

      // The bundle is a separate request, and on a cold cache it can still be in
      // flight when this module runs. Wait for the application to be there rather
      // than assuming it: a page that checks an app it loads has to.
      let waited = 0;
      for (; app.childElementCount === 0 && waited < 10000; waited += 25) {
        await new Promise((r) => setTimeout(r, 25));
      }
      check("the application loaded", app.childElementCount > 0);
      const click = (el) =>
        el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      const buttons = () => [...app.querySelectorAll("button")];
      // A Switch carries role="checkbox" too — it is the same control worn
      // differently — so the checkboxes are picked out by their own class.
      const boxes = () => [
        ...section("CheckBox").querySelectorAll(".v-CheckBox"),
      ];
      // styleName classes stay literal; the scope hash rides along beside them.
      const last = () => app.querySelector("p.last").textContent;
      const labelled = (text) =>
        buttons().find((b) => b.textContent.trim() === text);

      // --- it drew ------------------------------------------------------------
      check("the page mounted", app.querySelector("h1") !== null);
      // The section a control belongs to, found by its heading: the page has grown
      // enough that "every button" no longer means one thing.
      const section = (heading) =>
        [...app.querySelectorAll("section")].find(
          (s) => s.querySelector("h2").textContent === heading,
        );
      const intentButtons = () => [
        ...section("Button").querySelectorAll(".v-Button"),
      ];

      check(
        "every intent drew a button, and the two stateful ones",
        intentButtons().length === 9,
      );
      check("both checkboxes drew", boxes().length === 2);
      check(
        "the theme reached the controls",
        getComputedStyle(buttons()[1]).backgroundColor !== "rgba(0, 0, 0, 0)",
      );

      // --- a control reports what it did --------------------------------------
      click(labelled("primary"));
      check(
        "clicking a button is reported",
        last().includes("clicked the primary button"),
      );

      // A button is a real `<button>`, and a real button activates itself from
      // the keyboard by firing a click — Enter as the key goes down, Space as it
      // comes up. Cancelling the default on keydown cancels exactly that, and
      // the action hangs off the click: the button lit up under the key and did
      // nothing at all.
      //
      // A synthetic key press produces no native click, so what a page can check
      // is the half that broke it — that the default is left to happen.
      for (const key of ["Enter", " "]) {
        const press = new KeyboardEvent("keydown", {
          key,
          bubbles: true,
          cancelable: true,
        });
        labelled("default").dispatchEvent(press);
        check(
          `${key === " " ? "Space" : key} is left to the browser to act on`,
          press.defaultPrevented === false,
        );
        labelled("default").dispatchEvent(
          new KeyboardEvent("keyup", { key, bubbles: true }),
        );
      }

      // --- CheckBox -----------------------------------------------------------
      const remember = boxes()[0];
      check(
        "a checkbox starts unchecked",
        remember.getAttribute("aria-checked") === "false",
      );

      click(remember);
      check(
        "clicking it checked it",
        remember.getAttribute("aria-checked") === "true",
      );
      check(
        "and the controller heard the new value",
        last().includes("remember me: true"),
      );
      check(
        "which the summary line shows too",
        app.textContent.includes("remember=true"),
      );

      // --- TextField and SearchField ------------------------------------------
      const nameField = guard("name field", () =>
        app.querySelector(".v-Text:not(.v-Search) input"),
      );
      const searchBox = guard("search box", () =>
        app.querySelector(".v-Search"),
      );
      const searchInput = searchBox.querySelector("input");
      const clearButton = searchBox.querySelector(".Search-reset");
      const typeInto = (input, text) => {
        input.value = text;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      };

      check("the field drew its input", nameField instanceof HTMLInputElement);
      check(
        "with the placeholder it was given",
        nameField.placeholder === "Your name",
      );
      const fieldBox = getComputedStyle(nameField.closest(".v-Text"));
      check(
        `and its box is drawn by the stylesheet (border ${fieldBox.borderTopWidth} ${fieldBox.borderTopStyle}, radius ${fieldBox.borderRadius}, bg ${fieldBox.backgroundColor})`,
        fieldBox.borderRadius === "3px",
      );

      check(
        "the text sits off the field's left edge",
        parseFloat(getComputedStyle(nameField).paddingLeft) >= 8,
      );
      check(
        "and the search field is left out of that — its magnifier already does it",
        parseFloat(getComputedStyle(searchInput).paddingLeft) < 8,
      );

      // The GWT template always emits the two icon slots, and `.v-Text .icon`
      // is what gives them their margin. They are drawn by TextBase so that
      // rule — which belongs to TextBase's stylesheet — can reach them.
      const prefixSlot = nameField
        .closest(".v-Text")
        .querySelector("i.icon.prefix");
      const suffixSlot = nameField
        .closest(".v-Text")
        .querySelector("i.icon.suffix");
      check(
        "the field drew the icon slots the GWT template emits",
        prefixSlot !== null && suffixSlot !== null,
      );
      check(
        `and the sheet reaches them (margin ${prefixSlot && getComputedStyle(prefixSlot).margin}, font-size ${prefixSlot && getComputedStyle(prefixSlot).fontSize})`,
        prefixSlot &&
          getComputedStyle(prefixSlot).margin === "2px" &&
          getComputedStyle(prefixSlot).fontSize === "18px",
      );
      check(
        "the input takes the rest of the row",
        getComputedStyle(nameField).flexGrow === "1",
      );

      typeInto(nameField, "Mosaic");
      check(
        "typing reaches the controller",
        app.textContent.includes("name=Mosaic"),
      );

      nameField.dispatchEvent(
        new KeyboardEvent("keypress", { key: "Enter", bubbles: true }),
      );
      check("Enter is the action", last().includes("name submitted: Mosaic"));

      check(
        "the search field drew its magnifier",
        searchBox.querySelector(".search svg") instanceof SVGElement,
      );
      check(
        "and its clear button is out of the way while it is empty",
        getComputedStyle(clearButton).display === "none",
      );

      typeInto(searchInput, "combo");
      check(
        "searching reaches the controller",
        app.textContent.includes("search=combo"),
      );
      check(
        "and the clear button appears",
        getComputedStyle(clearButton).display === "block",
      );

      click(clearButton);
      check("clearing empties the field", searchInput.value === "");
      check("and says so", last().includes("search cleared"));

      // --- MaskedTextField ------------------------------------------------------
      const phoneBox = section("MaskedTextField").querySelector(".v-Text");
      const phoneInput = phoneBox.querySelector("input");
      const phoneView = () => phoneInput.value;

      phoneInput.focus();
      check(
        "focusing a masked field lays the mask out",
        phoneView() === "(___) ___-____",
      );

      // Typing is the input event the field listens for; the buffer decides
      // what actually lands, so the letters are refused and the digits are
      // placed around the mask's own punctuation.
      typeInto(phoneInput, "(2a16) 555x0134");
      check(
        `digits fill the slots and letters are refused (${phoneView()})`,
        phoneView() === "(216) 555-0134",
      );
      // The change is reported once the keystroke has been dealt with, as the
      // Java version's scheduleDeferred does, so it is not there yet.
      await Promise.resolve();
      check(
        "the controller is told the digits without the mask",
        app.textContent.includes("digits=2165550134"),
      );

      // Backspace closes the gap rather than leaving a hole in the middle.
      phoneInput.setSelectionRange(14, 14);
      phoneInput.dispatchEvent(
        new KeyboardEvent("keydown", { key: "Backspace", bubbles: true }),
      );
      check(
        `backspace takes the last digit back (${phoneView()})`,
        phoneView() === "(216) 555-013_",
      );

      // A mask is not content: a field holding only its own punctuation is blank.
      const phoneControl = phoneBox.__ibView ?? null;
      typeInto(phoneInput, "");
      phoneInput.blur();
      check(
        "and a field with nothing typed into it is emptied on leaving",
        phoneView() === "",
      );

      // --- LoadingButton and LoadingIndicator ---------------------------------
      const saveButton = labelled("Save");
      const loadingIndicator = app.querySelector(".v-LoadingIndicator");
      const spinner = () =>
        loadingIndicator.querySelector(".v-LoadingIndicator-spinner");

      check(
        "the loading button keeps the icon slot for its loader",
        saveButton.querySelector(".button-loader") !== null &&
          !saveButton.classList.contains("noIcon"),
      );
      check(
        "which is not shown before there is anything to wait for",
        getComputedStyle(saveButton.querySelector(".button-loader"))
          .visibility === "hidden",
      );
      check(
        "the indicator spins",
        getComputedStyle(spinner()).animationName === "v-loading-spin",
      );

      // Pressing it is what starts the work: the controller is told to save and
      // says when it is done, but it never puts the button into loading itself.
      click(saveButton);
      check(
        "saving disables the button",
        saveButton.getAttribute("aria-disabled") === "true",
      );
      check(
        "and says it is busy",
        saveButton.getAttribute("aria-busy") === "true",
      );
      check(
        "the indicator says what is happening",
        loadingIndicator.textContent.includes("Saving"),
      );

      await new Promise((r) => setTimeout(r, 600));
      check(
        "a wait that runs on shows the spinner",
        getComputedStyle(saveButton.querySelector(".button-loader"))
          .visibility === "visible",
      );
      const loaderRect = saveButton
        .querySelector(".button-loader")
        .getBoundingClientRect();
      const labelEl = saveButton.querySelector(".label");
      check(
        `and it is drawn to the left of the label (${loaderRect.width}px wide)`,
        loaderRect.width > 0 &&
          loaderRect.left < labelEl.getBoundingClientRect().left,
      );

      await new Promise((r) => setTimeout(r, 800));
      check(
        "the button comes back when the work is done",
        saveButton.getAttribute("aria-disabled") === null,
      );
      check("the indicator ticks", spinner().classList.contains("is-complete"));
      check(
        "and stops spinning",
        getComputedStyle(spinner()).animationName === "none",
      );
      check("and says so", loadingIndicator.textContent.includes("Saved"));

      // --- Switch -------------------------------------------------------------
      const switches = () => [
        ...section("Switch").querySelectorAll(".v-Switch"),
      ];
      const wifi = switches()[0];

      check("both switches drew", switches().length === 2);
      check(
        "the one told to be on is on",
        wifi.getAttribute("aria-checked") === "true",
      );
      check(
        "its state is on the root, which is what slides the knob",
        wifi.classList.contains("checked"),
      );
      check(
        "the track is drawn by its stylesheet",
        getComputedStyle(wifi.querySelector(".indicator")).borderRadius ===
          "28px",
      );

      click(wifi);
      check(
        "clicking flipped it",
        switches()[0].getAttribute("aria-checked") === "false",
      );
      check("and the controller heard it", last().includes("wi-fi: false"));
      check(
        "which the summary line shows",
        app.textContent.includes("wifi=false"),
      );

      // --- RadioGroup ---------------------------------------------------------
      const group = app.querySelector('[role="radiogroup"]');
      const radios = () => [...group.querySelectorAll('[role="radio"]')];
      const chosenRadio = () =>
        radios().findIndex((r) => r.getAttribute("aria-checked") === "true");

      check("the group drew an option per Radio", radios().length === 4);
      check("and starts on the one it was given", chosenRadio() === 1);
      check(
        "a group is one tab stop",
        radios().filter((r) => r.getAttribute("tabindex") === "0").length === 1,
      );
      check(
        "the chosen option's dot is drawn by the stylesheet",
        getComputedStyle(radios()[1].querySelector(".indicator"))
          .borderRadius === "50%",
      );

      click(radios()[2]);
      check("clicking an option chooses it", chosenRadio() === 2);
      check(
        "and only one stays chosen",
        radios().filter((r) => r.getAttribute("aria-checked") === "true")
          .length === 1,
      );
      check("the controller heard which", last().includes("size: large"));

      group.dispatchEvent(
        new KeyboardEvent("keydown", { key: "ArrowUp", bubbles: true }),
      );
      check("the arrow keys move the choice", chosenRadio() === 1);
      group.dispatchEvent(
        new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }),
      );
      group.dispatchEvent(
        new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }),
      );
      check(
        "and skip a disabled option rather than landing on it",
        chosenRadio() === 2,
      );

      // --- ComboBox -----------------------------------------------------------
      // By id: the toolbar's theme combo is a listbox too, and comes first.
      const select = app.querySelector("#colour-combo");
      const combo = select.parentElement;

      check("the combo drew a native select", select !== null);
      check("with an entry per Option", select.options.length === 4);
      check("a disabled entry says so", select.options[3].disabled === true);
      check(
        "and it drew its own chevron",
        combo.querySelector(".chevron svg") !== null,
      );
      check(
        "the frame is drawn by the theme",
        getComputedStyle(combo).borderTopWidth === "1px",
      );

      select.value = "blue";
      select.dispatchEvent(new Event("change", { bubbles: true }));
      check(
        "choosing an entry reaches the controller",
        last().includes("colour: blue"),
      );
      check(
        "which the summary line shows",
        app.textContent.includes("colour=blue"),
      );

      // --- Slider ---------------------------------------------------------------
      const sliderBox = section("Slider and RangeSlider");
      const slider = sliderBox.querySelector(".v-Slider");
      const sliderHandle = slider.querySelector(".handle");
      const range = slider.querySelector(".range");
      const press = (el, key) =>
        el.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));

      check(
        "the slider drew a track, a filled range and a knob",
        slider !== null && range !== null && sliderHandle !== null,
      );
      check(
        "the knob is placed along the track for its value",
        parseFloat(sliderHandle.style.left) > 0,
      );
      check(
        "and the filled range reaches it",
        parseFloat(range.style.width) > 0,
      );
      check(
        "the knob says what it is worth",
        sliderHandle.getAttribute("aria-valuenow") === "40" &&
          sliderHandle.getAttribute("aria-valuemax") === "100",
      );

      const wasAt = parseFloat(sliderHandle.style.left);
      press(sliderHandle, "ArrowRight");
      check(
        "an arrow key moves it a step, and the controller hears",
        sliderHandle.getAttribute("aria-valuenow") === "45" &&
          app.textContent.includes("volume=45"),
      );
      check(
        "and the knob moved with it",
        parseFloat(sliderHandle.style.left) > wasAt,
      );
      check(
        "the bar below follows the slider",
        section("ProgressBar").querySelector(".v-ProgressBar > div").style
          .width === "45%",
      );

      // The knob is a focusable div, so the browser rings it in black unless the
      // sheet says otherwise. What should show is the theme's ring, and only
      // once it is focused — which is a class the slider puts on, as
      // SliderHandle.onFocus does in Java.
      check(
        "the knob wears no ring until it is focused",
        !sliderHandle.classList.contains("is-focused") &&
          getComputedStyle(sliderHandle).outlineStyle === "none",
      );

      sliderHandle.focus();
      const focusedKnob = slider.querySelector(".handle");
      const ring = getComputedStyle(focusedKnob);
      check(
        `focusing it draws the theme's ring, not the browser's black one (${ring.outlineColor} ${ring.outlineStyle} ${ring.outlineWidth})`,
        focusedKnob.classList.contains("is-focused") &&
          ring.outlineStyle === "solid" &&
          ring.outlineWidth === "3px" &&
          ring.outlineColor !== "rgb(0, 0, 0)",
      );

      focusedKnob.blur();
      check(
        "and it goes again when focus leaves",
        !slider.querySelector(".handle").classList.contains("is-focused"),
      );

      // Dragging a knob is not a reason to ring it. A press must not hand it
      // focus at all — tabbing is what does that.
      const knobNow = () => slider.querySelector(".handle");
      knobNow().dispatchEvent(
        new PointerEvent("pointerdown", {
          bubbles: true,
          button: 0,
          clientX: 40,
        }),
      );
      check(
        "a press does not hand the knob focus",
        document.activeElement !== knobNow(),
      );
      check(
        "and leaves it unringed",
        !knobNow().classList.contains("is-focused") &&
          getComputedStyle(knobNow()).outlineStyle === "none",
      );
      knobNow().dispatchEvent(
        new PointerEvent("pointerup", { bubbles: true, button: 0 }),
      );

      // --- RangeSlider ------------------------------------------------------------
      const rangeSlider = sliderBox.querySelectorAll(".v-Slider")[1];
      const knobs = [...rangeSlider.querySelectorAll(".handle")];
      check("a range slider drew two knobs", knobs.length === 2);
      check(
        "each holding one end of the span",
        knobs[0].getAttribute("aria-valuenow") === "20" &&
          knobs[1].getAttribute("aria-valuenow") === "80",
      );
      check(
        "and each is bounded by the other, not by the track",
        knobs[0].getAttribute("aria-valuemax") === "80" &&
          knobs[1].getAttribute("aria-valuemin") === "20",
      );

      // The near knob is walked up against the far one; it must stop there.
      for (let i = 0; i < 70; i++) press(knobs[0], "ArrowRight");
      check(
        `the two cannot cross (${knobs[0].getAttribute("aria-valuenow")} vs ${knobs[1].getAttribute("aria-valuenow")})`,
        Number(knobs[0].getAttribute("aria-valuenow")) === 80,
      );
      check(
        "which the controller was told",
        app.textContent.includes("price=80–80"),
      );

      // --- SpinButton -------------------------------------------------------------
      const spin = section("SpinButton").querySelector(".v-SpinButton");
      const spinField = spin.querySelector("input");
      const spinButtons = [...spin.querySelectorAll(".v-Button")];
      const spinValue = () => spin.getAttribute("aria-valuenow");

      check(
        "a spin button drew a field and two steps",
        spinButtons.length === 2,
      );
      check("reading the value it was given", spinField.value === "3");
      check(
        "the steps carry the theme's icons",
        spinButtons.every((b) => b.querySelector(".icon svg") !== null),
      );

      const pressFully = (el) => {
        el.dispatchEvent(
          new PointerEvent("pointerdown", {
            bubbles: true,
            button: 0,
            pointerId: 1,
          }),
        );
        el.dispatchEvent(
          new PointerEvent("pointerup", {
            bubbles: true,
            button: 0,
            pointerId: 1,
          }),
        );
        el.dispatchEvent(new MouseEvent("click", { bubbles: true, button: 0 }));
      };
      // dispatchEvent ignores layout; a real click has to hit the element. Ask
      // the document what is actually at the middle of each step button.
      // dispatchEvent ignores layout, so a step button could be covered or of no
      // size and every check here would still pass while a real click missed
      // it. Ask the document what is actually at the middle of each one.
      spin.scrollIntoView({ block: "center" });
      check(
        "a real click would land on each step button",
        spinButtons.every((b) => {
          const r = b.getBoundingClientRect();
          if (r.width === 0 || r.height === 0) return false;
          const at = document.elementFromPoint(
            r.left + r.width / 2,
            r.top + r.height / 2,
          );
          return at !== null && b.contains(at);
        }),
      );

      // The click a real press becomes is only delivered if what was pressed is
      // still there at release. A redraw that rebuilds the icon under the
      // pointer — which is what a press on a Button sets off — takes the click
      // with it, and the button does nothing. Clicking its corner still worked,
      // which is how this was found.
      const stepIcon = spinButtons[1].querySelector("svg");
      spinButtons[1].dispatchEvent(
        new PointerEvent("pointerdown", {
          bubbles: true,
          button: 0,
          pointerId: 1,
        }),
      );
      check(
        "a press does not rebuild the icon under the pointer",
        spinButtons[1].querySelector("svg") === stepIcon &&
          document.contains(stepIcon),
      );
      spinButtons[1].dispatchEvent(
        new PointerEvent("pointerup", {
          bubbles: true,
          button: 0,
          pointerId: 1,
        }),
      );

      // And the full sequence a real press sends, not just a bare click.
      const pressed = [spinValue()];
      for (let i = 0; i < 2; i++) {
        pressFully(spin.querySelectorAll(".v-Button")[1]);
        pressed.push(spinValue() + "/" + spin.querySelector("input").value);
      }
      check(
        `pointerdown, pointerup and click step it and the field follows (${pressed.join(" ")})`,
        spinValue() === "5" && spin.querySelector("input").value === "5",
      );
      while (Number(spinValue()) > 3)
        click(spin.querySelectorAll(".v-Button")[0]);

      click(spinButtons[1]);
      check(
        "stepping up raises it and reports",
        spinValue() === "4" && app.textContent.includes("quantity=4"),
      );
      click(spinButtons[0]);
      check("stepping down lowers it again", spinValue() === "3");

      press(spinField, "ArrowUp");
      check("and the arrow keys step it too", spinValue() === "4");

      // The step buttons switch themselves off at the end they cannot pass.
      for (let i = 0; i < 10; i++) click(spinButtons[1]);
      check(`it stops at its maximum (${spinValue()})`, spinValue() === "10");
      check(
        "and the step it cannot take is disabled",
        spinButtons[1].getAttribute("aria-disabled") === "true" &&
          spinButtons[0].getAttribute("aria-disabled") === null,
      );
      for (let i = 0; i < 12; i++) click(spinButtons[0]);
      check(`down to its minimum (${spinValue()})`, spinValue() === "0");
      check(
        "where the other one switches off instead",
        spinButtons[0].getAttribute("aria-disabled") === "true" &&
          spinButtons[1].getAttribute("aria-disabled") === null,
      );

      // --- ProgressBar ------------------------------------------------------------
      const bars = [
        ...section("ProgressBar").querySelectorAll(".v-ProgressBar"),
      ];
      check("both bars drew", bars.length === 2);
      check(
        "a bar under way says so, and how far",
        bars[0].classList.contains("progress") &&
          bars[0].getAttribute("aria-valuenow") === "45",
      );
      // Pop fills with its accent, not the green primary: the theme sets no
      // --switch-checked-background, so the bar fell back to
      // --primary-background-color and was the only filled thing on the page
      // wearing the green while the slider beside it was teal.
      const setTheme = (name) => {
        const sel = app.querySelector("#theme-combo");
        sel.value = name;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
      };
      const fillIn = (name) => {
        setTheme(name);
        const style = getComputedStyle(document.documentElement);
        return {
          bar: getComputedStyle(bars[0].querySelector("div")).backgroundColor,
          range: getComputedStyle(slider.querySelector(".range"))
            .backgroundColor,
          accent: style.getPropertyValue("--accent-color").trim(),
          primary: style.getPropertyValue("--primary-background-color").trim(),
        };

      const onScreen = (li) => {

      // --- PopOver ------------------------------------------------------------

      );
      popButton.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      check(
        "its own button opens it rather than fighting itself",
        popVisible(),

      document.dispatchEvent(
        new KeyboardEvent("keydown", { key: "Escape", bubbles: true }),

        popButton.getBoundingClientRect().top - (window.innerHeight - 60),

        const b = popButton.getBoundingClientRect();
        const p = popover.getBoundingClientRect();
        return {
          above: Math.round(b.top - p.bottom),
          fits: p.top >= 0 && p.bottom <= window.innerHeight,
        };
      };
      check(
        `with no room below, it sits above instead (gap ${flipped().above}px)`,
        popVisible() && flipped().above === 9,

      check("and stays wholly in the window", flipped().fits);
      check(
        "its callout turns to point down at the button",
        popover.querySelector("b").className.includes("PopOver-callout--t") &&
          popover
            .querySelector("b b")
            .className.includes("PopOver-triangle--t"),
      );

        new KeyboardEvent("keydown", { key: "Escape", bubbles: true }),

            .className.includes("PopOver-triangle--r"),

      chooseWhere("top_center");
      popButton.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      const above = () => {
        const b = popButton.getBoundingClientRect();
        return Math.round(b.top - popover.getBoundingClientRect().bottom);
      };
      check(
        `and above it when that is what was asked for (gap ${above()}px)`,
        popVisible() && above() === 9,
      );

      document.dispatchEvent(
        new KeyboardEvent("keydown", { key: "Escape", bubbles: true }),
      );
      chooseWhere("bottom_center");

      // --- DialogBox ----------------------------------------------------------
      // A dialog of the application's own: SettingsDialog.mib with
      // SettingsDialogController.js beside it, which the compiler pairs with it.
      const dlgBox = section("DialogBox");
      const dlgButton = dlgBox.querySelector(".v-Button");
      const dialog = app.querySelector("dialog.v-Dialog");
      const mask = () => document.querySelector(".v-Dialog-mask");
      const dlgOpen = () => dialog.hasAttribute("open");
      const footerButton = (text) =>
        [...dialog.querySelectorAll("footer .v-Button")].find(
          (b) => b.textContent.trim() === text,
        );
      // The reveal is a timer and then a frame, as it is in the Java version;
      // the close is a 200ms fade the dialog is kept laid out for. Both are
      // waited on rather than slept through — how long either takes is the
      // browser's business, and a fixed delay is a race against it.
      const until = async (cond, ms = 2000) => {
        const end = performance.now() + ms;
        while (!cond() && performance.now() < end)
          await new Promise((r) => requestAnimationFrame(r));
        return cond();
      };
      const shown = () =>
        until(() => !dialog.className.includes("is-measuring"));
      // What matters once it is closed is that it takes no presses. Asked of
      // `pointer-events` rather than `display`: display is transitioned
      // discretely, so it stays laid out for the length of the fade, and a fade
      // the browser never runs would leave it that way.
      const inert = () =>
        until(() => getComputedStyle(dialog).pointerEvents === "none");

      check("it starts closed", !dlgOpen());
      check(
        "with its own markup's title in the header",
        dialog.querySelector("header h2").textContent === "Settings",

        "and the three regions the port draws",
        dialog.querySelector("header") !== null &&
          dialog.querySelector("main") !== null &&
          dialog.querySelector("footer") !== null,

      check(
        "a child naming no slot went into main",
        dialog.querySelector("main p") !== null,

      check(
        "and slot=footer put the buttons in the footer",
        footerButton("Cancel") !== undefined &&
          footerButton("Save") !== undefined,

      check("no mask is up until one is asked for", mask() === null);

      dlgButton.scrollIntoView({ block: "center" });
      dlgButton.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await shown();

      check("the page's button shows it", dlgOpen());
      check(
        "in the top layer, over everything the page drew",
        dialog.matches(":modal"),
      );
      check(
        "the shared mask dims what is behind it",
        mask() !== null && mask().className.includes("is-visible"),
      );
      check(
        "and the dialog's own backdrop is left clear, so nothing dims twice",
        dialog.className.includes("v-Dialog--no-mask"),
      );
      check(
        "the close button takes first focus",
        document.activeElement === dialog.querySelector("header .v-Button.close"),
      );
      check(
        "the theme paints its header",
        getComputedStyle(dialog.querySelector("header")).backgroundColor !==
          "rgba(0, 0, 0, 0)",

      check(
        "it packed to its content rather than the standard width",
        dialog.className.includes("v-Dialog--auto"),

      check(
        "the footer's buttons are one size, whatever their labels",
        footerButton("Cancel").getBoundingClientRect().width ===
          footerButton("Save").getBoundingClientRect().width,

      check("Escape closes a dialog with nothing in it", !dlgOpen());
      check(

        app.textContent.includes("saved=Grace") &&

      const centre = document.elementFromPoint(

        Math.round(window.innerHeight / 2),

      check(
        `nothing invisible is left over the page (${centre?.tagName.toLowerCase()})`,

      // --- SnackBar and Toast --------------------------------------------------
      // Bars live on a layer the manager mounts on the body, not inside #app.

      const snackButton = (text) =>
        [...snackBox.querySelectorAll(".v-Button")].find(

      check("with the bar on it", barsShowing().length === 1);

      check(
        "the theme paints the intent",
        getComputedStyle(barsShowing()[1]).backgroundColor !== "rgba(0, 0, 0, 0)",
      );

        new MouseEvent("click", { bubbles: true }),

      await barsSettled();
      const ownBar = barsShowing().find((b) => !b.className.includes("v-Toast"));
      check("the application's own bar drew", ownBar !== undefined);
      check(
        "holding what it was given, and a close button",

      // theme rule setting that property lands after the component's sheet at

      // bar at full strength so it sat there for the whole fade and then
      // vanished. Nothing but a real browser resolves a cascade, so this is the
      // only place it shows.
      const barOpacity = () => Number(getComputedStyle(ownBar).opacity);
      const solid = barOpacity();
      check(`a bar at rest is solid (opacity ${solid})`, solid > 0.9);

      const wasUp = barsShowing().length;
      undoButton.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      check(
        "pressing it reaches the page",
        last().includes("brought it back"),
      );
      check(
        "and the bar fades rather than vanishing",
        await until(() => barOpacity() < solid - 0.15, 400),
      );

        "and the bar goes",
        await until(() => barsShowing().length === wasUp - 1),

        "which the page counted",
        app.textContent.includes(`bars=${wasUp - 1}`),

      // Another corner means another manager: a manager's position is fixed

          getComputedStyle(menuItems()[0].querySelector(".icon")).height ===

      // The icon sits on the same line as the words beside it. The flex line

      // text centred by its line box reads high — so an icon left on the raw
      // line rides above the text it belongs to. Only a real layout has any of
      // these numbers.
      const middleOf = (el) => {
        const box = el.getBoundingClientRect();
        return box.top + box.height / 2;
      };
      const iconLine = menuItems()[0].querySelector(".icon");
      const labelLine = menuItems()[0].querySelector("span");
      const apart = middleOf(iconLine) - middleOf(labelLine);
      check(
        `the icon is on the label's line, not above it (out by ${apart.toFixed(2)}px)`,
        Math.abs(apart) < 0.5,

      check(
        `because it takes the same cap offset the label does (${getComputedStyle(iconLine).top})`,
        parseFloat(getComputedStyle(iconLine).top) > 0,

      menuPanel().dispatchEvent(

      menuPanel().dispatchEvent(

      const page = app.firstElementChild;
      const background = () => getComputedStyle(page).backgroundColor;
      const wear = (name) => {
        themeSelect.value = name;
        themeSelect.dispatchEvent(new Event("change", { bubbles: true }));
      };

      check(
        "the theme combo drew its entries",
        themeSelect.options.length === 3,
      );

      const aristo = background();
      wear("aristo_dark");
      check(
        "switching to aristo_dark repainted the page",
        background() !== aristo,
      );
      check("and it is a dark surface", background() === "rgb(51, 51, 51)");
      check("the switch is reported", last().includes("theme: aristo_dark"));

      wear("pop");
      check(
        "switching to pop repainted it again",
        background() === "rgb(255, 255, 255)",
      );
      check(
        "one stylesheet, rewritten — not one per theme",
        document.querySelectorAll("style[data-mosaic-theme]").length === 1,
      );

      // A popover is drawn the same in both light themes: the surface it floats on
      // is the one thing on the page that is not part of it, so aristo and pop
      // give it the same face and the same edge.
      const popFace = () => {
        const style = getComputedStyle(popover);
        return `${style.backgroundColor} / ${style.borderTopColor}`;
      };
      wear("aristo");
      const aristoPopOver = popFace();
      wear("pop");
      check(
        `aristo and pop draw a popover alike (${popFace()})`,
        popFace() === aristoPopOver,
      );
      wear("aristo_dark");
      check("and the dark theme does not", popFace() !== aristoPopOver);

      // The theme rounds the search field into a pill. Both Aristo sheets say so
      // in the same words, so both have to land the same way: the theme's rules
      // are prefixed with `:root` to outscore a component's scoped stylesheet,
      // and a sheet that lost that prefix would silently keep the component's
      // 4px corners instead.
      const searchRadius = () =>
        parseFloat(getComputedStyle(searchBox).borderTopLeftRadius);
      wear("aristo");
      const lightRadius = searchRadius();
      wear("aristo_dark");
      const darkRadius = searchRadius();
      check(
        `the search field is a pill in aristo too (light ${lightRadius}px, dark ${darkRadius}px)`,
        lightRadius === darkRadius && lightRadius > 20,
      );

      // The magnifier and the reset X are chrome in the dark theme, a step
      // quieter than the text. They are SVG, so it is fill and not color, and
      // the theme has to outscore the component sheet's --search-icon-fill.
      wear("aristo_dark");
      typeInto(searchInput, "x");
      const magnifierFill = getComputedStyle(
        searchBox.querySelector(".search svg"),
      ).fill;
      const resetFill = getComputedStyle(
        searchBox.querySelector("button.Search-reset > i svg"),
      ).fill;
      check(
        `the dark theme fills the magnifier and the reset X with #bbb (${magnifierFill} / ${resetFill})`,
        magnifierFill === "rgb(187, 187, 187)" &&
          resetFill === "rgb(187, 187, 187)",
      );
      click(clearButton);

      wear("aristo");
      check("and back to the one it started in", background() === aristo);

      // The controls kept the state they were in across all of that.
      check(
        "a swap redraws nothing",
        remember.getAttribute("aria-checked") === "true",
      );

      // --- the toolbar disables everything ------------------------------------
      click(labelled("Disable controls"));
      const disabled = (el) => el.getAttribute("aria-disabled") === "true";

      check(
        "every button in the sections is disabled",
        intentButtons().every(disabled),
      );
      check(
        "but not the toolbar's, which is what turns them back on",
        disabled(labelled("Enable controls")) === false,
      );
      check("the loading button too", disabled(saveButton));
      check("the checkboxes are disabled too", boxes().every(disabled));
      check(
        "the switches and the radio group as well",
        switches().every(disabled) &&
          disabled(group) &&
          radios().every(disabled),
      );
      // Saying so is not the same as looking it: the switch sheet matched only
      // `.disabled`, and the class a Control puts on is `is-disabled`, so a
      // disabled switch stayed at full strength.
      // Dimmed to exactly what the theme asks for. Opacity applies to the whole
      // subtree, so a sheet that fades the root *and* the parts inside it fades
      // them twice — which reads as a quarter rather than a half, and is what
      // the checkbox and the switch both used to do.
      const wantedOpacity = getComputedStyle(document.documentElement)
        .getPropertyValue("--opacity-disable")
        .trim();
      const opacityOf = (el) => (el ? getComputedStyle(el).opacity : "MISSING");
      const fadedParts = [
        ["switch", switches()[0]],
        ["switch knob", switches()[0].querySelector(".indicator")],
        ["checkbox", boxes()[0]],
        ["checkbox indicator", boxes()[0].querySelector(".indicator")],
        ["slider", app.querySelector(".v-Slider")],
      ];
      check(
        `every disabled control dims to ${wantedOpacity}, and nothing dims twice (${fadedParts
          .map(([name, el]) => name + " " + opacityOf(el))
          .join(", ")})`,
        fadedParts.every(([name, el]) =>
          el === null
            ? false
            : name.includes("knob") || name.includes("indicator")
              ? opacityOf(el) === "1"
              : opacityOf(el) === wantedOpacity,
        ),
      );

      // Disabling a control is itself a setFocus(false), so a field that was
      // never touched must not come out of it wearing a focus ring.
      check(
        "no disabled field wears a focus ring",
        [...app.querySelectorAll(".v-Text")].every(
          (box) => !box.classList.contains("is-focused"),
        ),
      );

      check(
        "so is the combo, down to its select",
        disabled(combo) && select.disabled === true,
      );
      check(
        "a disabled control is out of the tab order",
        boxes().every((b) => b.getAttribute("tabindex") === "-1"),
      );

      click(boxes()[1]);
      check(
        "and ignores a click",
        boxes()[1].getAttribute("aria-checked") === "false",
      );
      check(
        "so the page did not change",
        last().includes("disabled every control"),
      );

      // --- and enables them again ---------------------------------------------
      // The trigger is the part you press, so it answers the pointer — unless
      // there is nothing to press. A pointer cannot be synthesised, so the
      // theme's own rule is taken out of the sheet and asked directly: with
      // `:hover` dropped, does what is left still match this combo? It matched
      // before, which is how a disabled trigger still lit up under the pointer.
      const chevronHoverRules = [...document.styleSheets]
        .flatMap((sheet) => {
          try {
            return [...sheet.cssRules];
          } catch {
            return [];
          }
        })
        .filter(
          (rule) =>
            rule.selectorText &&
            rule.selectorText.includes(".chevron") &&
            rule.selectorText.includes(":hover"),
        );

      check(
        "the theme states a hover face for the trigger",
        chevronHoverRules.length > 0,
      );
      check(
        "which no longer reaches the combo once it is disabled",
        chevronHoverRules.every(
          (rule) =>
            !combo.matches(
              rule.selectorText.replace(/:hover|\s*\.chevron\b/g, "").trim(),
            ),
        ),
      );

      click(labelled("Enable controls"));
      check(
        "enabling brings them back",
        intentButtons().some(disabled) === false,
      );

      click(boxes()[1]);
      check(
        "the control works once more",
        boxes()[1].getAttribute("aria-checked") === "true",
      );
      check("and reports again", last().includes("newsletter: true"));

      // --- what the themes and the disabled state actually paint ---------------
      // Colours are transitioned, and a transition does not advance under headless
      // virtual time — so each of these is read after letting one settle.
      const settle = () => new Promise((r) => setTimeout(r, 400));
      const indicator = () => app.querySelector('[role="checkbox"] .indicator');
      const rgb = (hex) => {
        const n = parseInt(hex.trim().slice(1), 16);
        return `rgb(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255})`;
      };

      wear("aristo_dark");
      await settle();
      const vars = () => getComputedStyle(document.documentElement);
      check(
        "a ticked box in the dark theme wears the theme's primary border",
        getComputedStyle(indicator()).borderTopColor ===
          rgb(vars().getPropertyValue("--primary-border-color")),
      );
      check(
        "which is not the near-black it used to be",
        getComputedStyle(indicator()).borderTopColor !== "rgb(20, 38, 47)",
      );

      // An unchecked well needs an edge that reads: its rim used to be #4d4d52,
      // the same value as the panel behind it, so the box looked like a bare face.
      click(remember); // back to unchecked
      await settle();
      const lightness = (c) =>
        c
          .match(/\d+/g)
          .slice(0, 3)
          .reduce((a, n) => a + Number(n), 0) / 3;
      const rim = getComputedStyle(indicator()).borderTopColor;
      const behind = getComputedStyle(
        app.querySelector("section"),
      ).backgroundColor;
      check(
        `an unchecked box in the dark theme has a rim that reads (rim ${rim} on ${behind})`,
        lightness(rim) - lightness(behind) > 15,
      );

      wear("pop");
      await settle();
      const successButton = buttons().find(
        (b) => b.textContent.trim() === "success",
      );
      check(
        "pop draws a success button in its own green",
        getComputedStyle(successButton).backgroundColor ===
          rgb(vars().getPropertyValue("--success-background-color")),
      );
      check(
        "with white on it",
        getComputedStyle(successButton).color === "rgb(255, 255, 255)",
      );

      // --- pop's snackbars ----------------------------------------------------
      // Pop states no snackbar rules of its own, so its bars used to fall back
      // to the component sheet's `--default-*` — the face of a push button,
      // #f6f4f2 on Pop's white page. A notification that has to be looked for.
      /**
       * The three channels of a colour, 0-255. Two forms turn up: `rgb(...)`,
       * which the browser gives for a plain colour, and `color(srgb r g b)`,
       * which is what a `color-mix()` resolves to — and states its channels as
       * fractions rather than bytes.
       */
      const channels = (colour) => {
        const scale = colour.trim().startsWith("color(") ? 255 : 1;
        return colour
          .match(/[\d.]+/g)
          .slice(0, 3)
          .map((n) => Number(n) * scale);
      };
      const luminance = (colour) => {
        const [r, g, b] = channels(colour).map((v) => {
          const c = v / 255;
          return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      /** WCAG contrast, which is what "legible" can be asked as a number. */
      const contrast = (a, b) => {
        const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
        return (hi + 0.05) / (lo + 0.05);
      };

      const snackSection = section("SnackBar and Toast");
      const barsOnScreen = () => [
        ...document.querySelectorAll(".v-SnackBar-container .v-SnackBar"),
      ];
      /**
       * Press one of the section's buttons and give back the bar it raised —
       * the one that was not there before, rather than the last in the list: a
       * stack pinned to the top puts its newest bar first, and this runs with
       * the corner left wherever the checks above set it.
       */
      const popBar = (label) => {
        const before = barsOnScreen();
        [...snackSection.querySelectorAll(".v-Button")]
          .find((b) => b.textContent.trim() === label)
          .dispatchEvent(new MouseEvent("click", { bubbles: true }));
        return barsOnScreen().find((bar) => !before.includes(bar));
      };

      for (const [label, kind] of [
        ["Say something", "plain"],
        ["Saved", "success"],
        ["Careful", "warning"],
        ["That failed", "danger"],
      ]) {
        const bar = popBar(label);
        const style = getComputedStyle(bar);
        const ratio = contrast(style.color, style.backgroundColor);
        check(
          `pop's ${kind} bar reads against its own surface (${ratio.toFixed(1)}:1, ${style.backgroundColor})`,
          ratio >= 4.5,
        );
      }

      // And the bar has to be findable on the page it floats over: Pop's
      // workspace is white, so a near-white bar with a pale hairline is not.
      const popPlain = popBar("Say something");
      const popStyle = getComputedStyle(popPlain);
      const behindBar = getComputedStyle(app.querySelector("section"))
        .backgroundColor;
      check(
        `pop's bar is set off from the page behind it (bar ${popStyle.backgroundColor}, page ${behindBar})`,
        popStyle.boxShadow !== "none" &&
          contrast(popStyle.borderTopColor, popStyle.backgroundColor) > 1.1,
      );
      check(
        "and is solid rather than the component sheet's 0.97",
        Number(popStyle.opacity) === 1,
      );

      [...snackSection.querySelectorAll(".v-Button")]
        .find((b) => b.textContent.trim() === "Close them all")
        .dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await settle();

      wear("aristo");
      await settle();

      // The trigger dims with the control it belongs to: the browser fades a
      // disabled <select> by itself, which used to leave the chevron beside it at
      // full strength.
      click(labelled("Disable controls"));
      const dimmed = getComputedStyle(combo);
      check(
        "a disabled combo dims as a whole",
        dimmed.opacity === vars().getPropertyValue("--opacity-disable").trim(),
      );
      check(
        "its trigger included",
        getComputedStyle(combo.querySelector(".chevron")).opacity === "1" &&
          getComputedStyle(combo.querySelector("select")).opacity === "1",
      );
      click(labelled("Enable controls"));

      // --- TitleBar and ToolBar -------------------------------------------------
      const barBox = section("TitleBar and ToolBar");
      const frame = barBox.querySelector("div");
      const titleBar = barBox.querySelector(".v-TitleBar");
      const titleLabel = barBox.querySelector(".v-TitleBar-title");
      const toolBar = barBox.querySelector(".v-ToolBar");
      const overflowBtn = () => toolBar.querySelector(".v-ToolBar-overflow");
      // The overflow button is a ToolBarItem too, so the items are the ones
      // outside the slot it sits in.
      const tools = () =>
        [...toolBar.querySelectorAll(".v-ToolBarItem")].filter(
          (item) => !overflowBtn().contains(item),
        );
      const inBar = () =>
        tools()
          .filter((item) => getComputedStyle(item).display !== "none")
          .map((item) => item.textContent.trim());

      // A toggle latches on the press, as every toggle in the framework does,
      // so the press is what has to be sent — the click alone would not flip it.
      const pressBarButton = (el) => {
        el.dispatchEvent(
          new PointerEvent("pointerdown", { bubbles: true, button: 0 }),
        );
        click(el);
      };

      barBox.scrollIntoView({ block: "center" });
      // Let the page settle where it landed: a popover puts itself away when the
      // page scrolls under it, and a scroll still arriving would close the menu
      // this block is about to open.
      await settle();

      // Centred on the bar itself, not on the room the side regions leave —
      // which is the whole reason the three of them are out of flow.
      const offCentre = () => {
        const bar = titleBar.getBoundingClientRect();
        const label = titleLabel.getBoundingClientRect();
        return Math.abs(
          (label.left + label.right) / 2 - (bar.left + bar.right) / 2,
        );
      };
      check(
        `the title is centred on the strip (out by ${offCentre().toFixed(1)}px)`,
        offCentre() <= 1,
      );
      check(
        "and the strip was told how narrow it may get",
        parseFloat(titleBar.style.minWidth) > 0,
      );

      // The theme's push-button gloss must not come through on a bar meant to be
      // flat, and the item is as tall as the strip rather than floating in it,
      // clipped: both are what the sheet's extra class of specificity buys.
      const backButton = titleBar.querySelector(".v-TitleBarButton");
      const backFace = getComputedStyle(backButton);
      check(
        `a title bar button is flat, with no push-button gloss on it (bg ${backFace.backgroundImage}, shadow ${backFace.boxShadow})`,
        backFace.backgroundImage === "none" && backFace.boxShadow === "none",
      );
      check(
        `and fills the strip's height (${backButton.getBoundingClientRect().height} of ${titleBar.getBoundingClientRect().height})`,
        Math.abs(
          backButton.getBoundingClientRect().height -
            titleBar.getBoundingClientRect().height,
        ) <= 1,
      );

      // --- MenuBarItem ---------------------------------------------------------
      const barItems = [...titleBar.querySelectorAll(".v-MenuBarItem")];
      const barMenu = () =>
        [...document.querySelectorAll(".v-MenuBarItem-menu")].find(
          (menu) => getComputedStyle(menu).visibility !== "hidden",
        );

      check(
        `the strip drew its two menu bar items (${barItems
          .map((i) => i.textContent.trim())
          .join("|")})`,
        barItems.map((i) => i.textContent.trim()).join("|") === "File|Edit",
      );
      check(
        `and only the one that asked for it advertises its menu (${!!barItems[0].querySelector(
          "i.chevron",
        )}, ${!!barItems[1].querySelector("i.chevron")})`,
        !!barItems[0].querySelector("i.chevron") &&
          !barItems[1].querySelector("i.chevron"),
      );

      pressBarButton(barItems[0]);
      await settle();
      const dropped = barMenu();
      check(
        "pressing one drops its menu, and the item says so",
        !!dropped &&
          barItems[0].className.includes("is-active") &&
          barItems[0].getAttribute("aria-expanded") === "true",
      );

      // A menu bar's menu hangs off its item rather than floating below it:
      // left edges flush, and no gap where a callout would have gone.
      const barItemBox = barItems[0].getBoundingClientRect();
      const barMenuBox = dropped?.getBoundingClientRect() ?? {};
      check(
        `it hangs from the item's left edge and meets its bottom (${Math.round(
          barMenuBox.left - barItemBox.left,
        )}px across, ${Math.round(barMenuBox.top - barItemBox.bottom)}px down)`,
        Math.abs(barMenuBox.left - barItemBox.left) <= 1 &&
          Math.abs(barMenuBox.top - barItemBox.bottom) <= 1,
      );
      check(
        `and squares the corners it shares with the item (${
          getComputedStyle(dropped).borderRadius
        })`,
        getComputedStyle(dropped).borderTopLeftRadius === "0px" &&
          getComputedStyle(dropped).borderBottomLeftRadius !== "0px",
      );

      // With one open the bar is one control: the pointer alone switches.
      barItems[1].dispatchEvent(
        new PointerEvent("pointerenter", { bubbles: true }),
      );
      await settle();
      check(
        "moving the pointer to its neighbour switches menus without a press",
        !barItems[0].className.includes("is-active") &&
          barItems[1].className.includes("is-active") &&
          barMenu()?.textContent.trim().startsWith("Cut"),
      );

      const cutLine = barMenu().querySelector(".v-MenuItem");
      click(cutLine);
      await settle();
      check(
        "choosing a line is what the item reports, not the press that opened it",
        app.textContent.includes("bar=Edit: cut") &&
          !barItems[1].className.includes("is-active"),
      );

      // A toolbar item stacks: its label sits below its icon, not beside it.
      const findItem = tools()[0];
      const findIcon = findItem.querySelector(".icon").getBoundingClientRect();
      const findLabel = findItem
        .querySelector(".label")
        .getBoundingClientRect();
      check(
        "a toolbar item stacks its label under its icon",
        findLabel.top >= findIcon.bottom - 1 &&
          Math.abs(
            (findLabel.left + findLabel.right) / 2 -
              (findIcon.left + findIcon.right) / 2,
          ) <= 1,
      );

      check(
        "the toolbar holds every item, with nothing in overflow",
        inBar().join("|") === "Find|Delete|Account|Dismiss|Nowhere" &&
          getComputedStyle(overflowBtn()).display === "none",
      );

      // Too narrow for all of them: the trailing ones leave first, so what is
      // at the leading edge survives longest.
      frame.style.width = "300px";
      await settle();
      const left = inBar();
      check(
        `a narrowed bar keeps the leading items (${left.join(", ") || "none"})`,
        left.length > 0 &&
          left.length < 5 &&
          left[0] === "Find" &&
          !left.includes("Nowhere"),
      );
      check(
        "and the overflow button appears",
        getComputedStyle(overflowBtn()).display !== "none",
      );

      pressBarButton(overflowBtn().querySelector("button"));
      await settle();
      const overflowMenu = [...document.querySelectorAll(".v-Menu")].find(
        (menu) => getComputedStyle(menu).visibility !== "hidden",
      );
      check(
        "pressing it drops a menu of exactly what left the bar",
        !!overflowMenu &&
          [...overflowMenu.querySelectorAll(".v-MenuItem")]
            .map((line) => line.textContent.trim())
            .join("|") ===
            ["Find", "Delete", "Account", "Dismiss", "Nowhere"]
              .filter((name) => !left.includes(name))
              .join("|"),
      );

      // Choosing a line works the item it stands for, which is the whole point
      // of moving an item rather than dropping it.
      const line = overflowMenu?.querySelector(".v-MenuItem:not(.is-disabled)");
      const chosen = line?.textContent.trim();
      click(line);
      await settle();
      check(
        `choosing "${chosen}" fires that item's action`,
        app.textContent.includes(`bar=${chosen}`),
      );
      check(
        "and the button comes back up with the menu",
        !overflowBtn().querySelector("button").className.includes("is-active"),
      );

      frame.style.width = "";
      await settle();
      check(
        "widened again, every item comes back to the bar",
        inBar().length === 5 &&
          getComputedStyle(overflowBtn()).display === "none",
      );

      // --- Drawer ---------------------------------------------------------------
      // A panel docked to the right that pushes the page aside rather than
      // covering it. What the unit tests cannot see is the push itself: it is
      // padding on the document, and only a real layout has any.
      //
      // Last of everything, because this is the one section that resizes the
      // page: the drawer pushes what is beside it, the toolbar reflows into
      // the narrower room and moves items into an overflow menu, and a
      // section running afterwards would find a menu it did not put there.
      const drawerBox = section("Drawer");
      const drawer = () => app.querySelector(".v-Drawer");
      const drawerOut = () =>
        drawer().className.includes("is-open");
      const pagePush = () =>
        Math.round(parseFloat(getComputedStyle(document.body).paddingRight) || 0);
      const drawerButton = (text) =>
        [...drawerBox.querySelectorAll(".v-Button")].find(
          (b) => b.textContent.trim() === text,
        );
      // The slide is 220ms and the panel says it is open at 260ms.
      const slid = () => new Promise((r) => setTimeout(r, 340));

      check("the drawer drew, from the page's own .mib", drawer() !== null);
      check("and starts away", !drawerOut());
      check(
        "out of the tab order while it is",
        drawer().hasAttribute("inert") &&
          drawer().getAttribute("aria-hidden") === "true",
      );
      check("with nothing taken from the page", pagePush() === 0);
      // Measured against the layout viewport rather than `window.innerWidth`,
      // which counts the scrollbar the drawer is not positioned against.
      const viewport = () => document.documentElement.clientWidth;
      check(
        `parked off screen, past the right edge (left ${Math.round(drawer().getBoundingClientRect().left)}px of ${viewport()}px)`,
        Math.round(drawer().getBoundingClientRect().left) >= viewport() - 1,
      );

      const pageWidthBefore = app.getBoundingClientRect().width;
      drawerButton("Filters…").click();
      await slid();

      check("the page's button brings it out", drawerOut());
      check("and it joins the tab order", !drawer().hasAttribute("inert"));
      // Which is what lets it take the keyboard at all: while it is away the
      // panel is `inert`, and an inert subtree cannot be focused. A real
      // browser is the only place that holds.
      check(
        `the close button has the keyboard (${document.activeElement?.className?.split(" ")[0] ?? "nothing"})`,
        document.activeElement === drawer().querySelector(".v-Button.close"),
      );
      check(
        `it is on screen now (left ${Math.round(drawer().getBoundingClientRect().left)}px of ${viewport()}px)`,
        Math.round(drawer().getBoundingClientRect().right) <= viewport() + 1 &&
          drawer().getBoundingClientRect().left < viewport(),
      );
      check(
        `the page was pushed aside by its width (${pagePush()}px vs ${Math.round(drawer().getBoundingClientRect().width)}px)`,
        pagePush() > 0 &&
          Math.abs(pagePush() - drawer().getBoundingClientRect().width) <= 1,
      );
      check(
        `so the page has less room than it had (${Math.round(app.getBoundingClientRect().width)}px was ${Math.round(pageWidthBefore)}px)`,
        app.getBoundingClientRect().width < pageWidthBefore,
      );
      check(
        "the theme paints it",
        getComputedStyle(drawer()).backgroundColor !== "rgba(0, 0, 0, 0)",
      );
      check(
        "its header reads what the markup gave it",
        drawer().querySelector(".title").textContent === "Filters",
      );

      // It is not modal: the page behind it still works.
      const stillLive = labelled("Say something");
      stillLive.click();
      check(
        "the page behind it is still live",
        last().includes("toast: Something happened") && drawerOut(),
      );

      // Its own controls answer to its own controller.
      const unread = drawer().querySelector('[role="checkbox"]');
      unread.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await until(() => app.textContent.includes("filters=unread"));
      check(
        `a control inside it answers its own controller (${app.textContent.match(/filters=(\S+)/)?.[1]})`,
        app.textContent.includes("filters=unread"),
      );

      drawer()
        .querySelector(".v-Button.close")
        .dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await slid();
      check("its close button puts it away", !drawerOut());
      check(
        "and the panel is out of the tab order again",
        drawer().hasAttribute("inert"),
      );
      check(`and the page gets its room back (${pagePush()}px)`, pagePush() === 0);
      check(
        "which the page was told about",
        app.textContent.includes("drawer=away"),
      );

      // A colour well inside it: its chooser is a popover, and the drawer's
      // stylesheet is written around exactly this — `overflow: visible` so the
      // chooser is not clipped by the panel, and a z-index below popovers so it
      // stacks over the panel rather than under.
      drawerButton("Filters…").click();
      await slid();
      check("out again", drawerOut());

      const drawerWell = drawer().querySelector(".cw-well");
      // The ColorWell section above left its own chooser on the page, and a
      // well keeps the one it made. So this is the chooser that was not there
      // a moment ago, rather than whichever the document happens to hold.
      const choosersBefore = new Set(document.querySelectorAll(".ccp-root"));
      const drawerChooser = () =>
        [...document.querySelectorAll(".ccp-root")].find(
          (c) => !choosersBefore.has(c),
        ) ?? null;

      check("the drawer holds a colour well", drawerWell !== null);
      check("with no chooser of its own until one is asked for", drawerChooser() === null);

      drawerWell.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await until(() => drawerChooser() !== null);
      const chooserPanel = () => drawerChooser().closest(".v-PopOver");
      check(
        "pressing it opens the chooser",
        getComputedStyle(chooserPanel()).visibility === "visible",
      );

      const panelBox = drawer().getBoundingClientRect();
      const overBox = chooserPanel().getBoundingClientRect();
      check(
        `the chooser is not clipped by the panel it was opened in (${Math.round(overBox.left)}px against the drawer's ${Math.round(panelBox.left)}px)`,
        overBox.left < panelBox.left,
      );
      check(
        `and stacks over the drawer, not under it (popover ${getComputedStyle(chooserPanel()).zIndex} vs drawer ${getComputedStyle(drawer()).zIndex})`,
        Number(getComputedStyle(chooserPanel()).zIndex) >
          Number(getComputedStyle(drawer()).zIndex),
      );

      const reported = () => app.textContent.match(/filters=(.+?) drawer=/)?.[1] ?? "";
      const startedAs = reported();
      // A swatch settles on the press, not the click — and swatch 18 is the
      // blue the well already holds, so this takes another one.
      const drawerSwatch = drawerChooser().querySelectorAll(".ccp-swatch")[8];
      drawerSwatch.dispatchEvent(
        new PointerEvent("pointerdown", { bubbles: true }),
      );
      await until(() => reported() !== startedAs);
      check(
        `choosing a colour reaches the drawer's own controller (${reported()})`,
        /#[0-9A-Fa-f]{6}$/.test(reported().trim()) && reported() !== startedAs,
      );
      check("and the drawer is still out", drawerOut());

      drawerButton("Filters…").click();
      await slid();
      check("putting it away leaves the page as it was", !drawerOut() && pagePush() === 0);


      document.querySelector("#results").textContent = log.join("\n");
      document.title =
        failed === 0
          ? `verdict PASS (${log.length} checks)`
          : `verdict FAIL (${failed} of ${log.length})`;
    </script>
  </body>
</html>
