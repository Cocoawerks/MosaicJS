<!doctype html>
<meta charset="utf-8" />
<title>MosaicJS browser check</title>
<!--
  A browser smoke test for the real DOM (the node tests use a shim).

    mosaic check examples/Counter_component

  It loads that application's compiled modules unbundled, so it exercises the
  compiler's output and the runtime together. Build the app first; `mosaic
  check` does that for you.

  Each assertion prints a line; the page title ends in PASS or FAIL.
-->
<div id="stage"></div>
<pre id="results"></pre>
<!-- These modules are loaded unbundled, so the browser needs to be told what
     `mosaic` resolves to. A bundled page never needs this: `bun build` has
     already resolved it. -->
<script type="importmap">
  {
    "imports": {
      "mosaic": "../examples/Counter_component/build/node_modules/mosaic/runtime/mosaic.js",
      "mosaic/frameworks/ui": "../examples/Counter_component/build/node_modules/mosaic/frameworks/ui/index.js"
    }
  }
</script>
<script type="module">
  import { addStyles, Component, h, mount } from "mosaic";
  import Main from "../examples/Counter_component/build/src/main.mib.js";
  import { Button, CheckBox, ComboBox, Option } from "mosaic/frameworks/ui";

  // A drawn view for the checks below: the shape the compiler emits for a
  // `draw()` full of JSX, written out by hand. It belongs to this page rather
  // than to an example app, so rewriting an example cannot take it with it.
  const SCOPE = "ctr1abc";
  // Scoped the way the compiler scopes a `<style>` block: the attribute goes
  // on the last compound, so a rule still reaches this view's own children.
  // Keyed for this page: addStyles installs a stylesheet once per key, and
  // Counter.js in the example brings its own "counter" sheet along.
  addStyles(
    "browser-check-counter",
    `.counter.${SCOPE}{display:flex;gap:.5rem}` +
      `.counter .value.${SCOPE}{text-align:center}`,
  );

  class Counter extends Component {
    constructor() {
      super();
      this.count = 0;
    }

    get limit() {
      return Number(this.props.limit ?? 3);
    }

    get status() {
      return this.count >= this.limit ? "high" : "";
    }

    increment() {
      this.count += 1;
    }

    decrement() {
      this.count -= 1;
    }

    draw() {
      return h(
        "div",
        { class: `counter ${SCOPE}` },
        h(Button, { text: "-", action: (...a) => this.decrement(...a) }),
        h(
          "output",
          { class: `value ${this.status} ${SCOPE}`.replace(/\s+/g, " ") },
          String(this.count),
        ),
        h(Button, {
          text: "+",
          intent: "primary",
          action: (...a) => this.increment(...a),
        }),
      );
    }
  }

  const log = [];
  let failed = 0;
  const check = (name, cond) => {
    log.push(`${cond ? "PASS" : "FAIL"}  ${name}`);
    if (!cond) failed++;
  };

  // Report a thrown error instead of silently leaving the page half-rendered.
  window.addEventListener("error", (e) => {
    document.querySelector("#results").textContent += `\nERROR  ${e.message}`;
    document.title = "verdict FAIL (threw)";
  });

  const stage = document.querySelector("#stage");
  const click = (el) =>
    el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  // A scope is a class, and a bare hash — the compiler appends it last, which
  // is how it is picked out.
  const scopeOf = (el) => [...el.classList].at(-1);

  // --- a drawn view, patched on redraw ------------------------------------
  const host = document.createElement("div");
  stage.appendChild(host);
  const counter = mount(Counter, host, { limit: "2" }).view;

  check(
    "drawn view rendered from draw()",
    host.querySelector(".counter") !== null,
  );
  // The scope class rides along with whatever the markup asked for.
  const classesOf = (el) => [...el.classList].slice(0, -1);
  check(
    "JSX styleName became class",
    classesOf(host.querySelector("output")).join(" ") === "value",
  );
  // `outlet` and `action` are compiled away — a ref and a listener, not
  // attributes left on the element.
  check(
    "directives are absent from the DOM",
    !/\s(outlet|action)=/.test(host.innerHTML),
  );

  const root = host.firstElementChild;
  const output = host.querySelector("output");
  const [minus, plus] = host.querySelectorAll("button");

  click(plus);
  check("action called the method", counter.count === 1);
  check("redraw updated the text", output.textContent === "1");
  check("redraw reused the root node", host.firstElementChild === root);
  check(
    "redraw reused the output node",
    host.querySelector("output") === output,
  );

  click(plus);
  check(
    "JSX conditional applied on redraw",
    classesOf(output).join(" ") === "value high",
  );
  click(minus);
  check(
    "attribute reverted on redraw",
    classesOf(output).join(" ") === "value",
  );
  check("handlers were not stacked", counter.count === 1);

  // Focus survives a patch but not a rebuild — the point of diffing.
  plus.focus();
  click(plus);
  check("focus survived the redraw", document.activeElement === plus);

  // --- scoped styles ------------------------------------------------------
  const scope = scopeOf(root);
  check("drawn view elements carry a scope", !!scope);
  check("its own elements share that scope", output.classList.contains(scope));
  check(
    "scoped CSS applied (display:flex)",
    getComputedStyle(root).display === "flex",
  );
  check(
    "scoped CSS reaches its own children (text-align)",
    getComputedStyle(output).textAlign === "center",
  );

  // <Button/> is a separate module: its own scope, its own stylesheet.
  const buttonScope = scopeOf(plus);
  check(
    "child component has its own scope",
    !!buttonScope && buttonScope !== scope,
  );
  check(
    "child component's CSS applies",
    getComputedStyle(plus).cursor === "pointer",
  );

  // A stylesheet scoped to this module must not leak to an unrelated element.
  const stray = document.createElement("div");
  stray.className = "counter";
  stage.appendChild(stray);
  check(
    "styles do not leak outside the view",
    getComputedStyle(stray).display !== "flex",
  );

  // --- main.mib composing the drawn view -----------------------------------
  const pageHost = document.createElement("div");
  stage.appendChild(pageHost);
  const page = { title: "Mosaic" };
  mount(Main, pageHost, {}, page);

  check(
    ".mib page bound {title}",
    pageHost.querySelector("h1").textContent === "Mosaic",
  );
  check(
    ".mib page rendered the drawn child",
    pageHost.querySelector(".counter") !== null,
  );
  // A scope belongs to a file, and every component is one: the page, the
  // Counter it hosts and the Buttons that Counter draws are three modules and
  // three scopes.
  check(
    "page and the component it hosts have their own scopes",
    scopeOf(pageHost.firstElementChild) !==
      scopeOf(pageHost.querySelector(".counter")),
  );
  check(
    "a component from another module has its own scope",
    scopeOf(pageHost.querySelector("button")) !==
      scopeOf(pageHost.firstElementChild),
  );

  page.title = "Updated";
  page.view.needsDisplay();
  check(
    "{title} refreshed",
    pageHost.querySelector("h1").textContent === "Updated",
  );

  click(pageHost.querySelectorAll(".counter button")[1]);
  check(
    "drawn child redrew inside the page",
    pageHost.querySelector("output").textContent === "1",
  );
  check(
    "page around the child was untouched",
    pageHost.querySelector("h1").textContent === "Updated",
  );

  // --- CheckBox: the ported control, in a real browser ---------------------
  const boxHost = document.createElement("div");
  stage.appendChild(boxHost);
  const fired = [];
  const box = mount(CheckBox, boxHost, {
    text: "Remember me",
    action: (control, value) => fired.push(value),
  }).view;
  const boxEl = boxHost.firstElementChild;
  const indicator = boxEl.querySelector(".indicator");

  check("checkbox drew its role", boxEl.getAttribute("role") === "checkbox");
  check(
    "checkbox is labelled by its own label",
    boxEl.getAttribute("aria-labelledby") === boxEl.querySelector("span").id,
  );
  check(
    "checkbox indicator is positioned by its stylesheet",
    getComputedStyle(indicator).position === "absolute",
  );
  check(
    "unchecked indicator is not filled",
    getComputedStyle(indicator).backgroundColor !==
      getComputedStyle(document.body).color,
  );
  check(
    "the check mark is hidden while unchecked",
    getComputedStyle(boxEl.querySelector(".check")).display === "none",
  );

  click(boxEl);
  check("clicking checked it", box.value === true);
  check("aria-checked followed", boxEl.getAttribute("aria-checked") === "true");
  check(
    "the check mark is shown once checked",
    getComputedStyle(boxEl.querySelector(".check")).display === "inline-block",
  );
  check(
    "the action fired with the new value",
    fired.length === 1 && fired[0] === true,
  );

  boxEl.dispatchEvent(
    new KeyboardEvent("keydown", { key: " ", bubbles: true }),
  );
  check("Space unchecked it", box.value === false);
  check("the action fired again", fired.length === 2 && fired[1] === false);

  // --- the theme reaches the control --------------------------------------
  // These are aristo's own values, read off the elements the component drew:
  // what is checked is that `theme` in info.json ends up painting the
  // control, variable by variable, and not merely that something applied.
  // Drawn in the state being read, so no transition stands between the class
  // and the colour — the one above has been clicked since it mounted. Each
  // gets a host of its own: mounting into one replaces what it held.
  const plainHost = document.createElement("div");
  stage.appendChild(plainHost);
  mount(CheckBox, plainHost, { text: "Unchecked" });
  const plainInd = plainHost.querySelector(".indicator");

  const themedHost = document.createElement("div");
  stage.appendChild(themedHost);
  const themed = mount(CheckBox, themedHost, {
    text: "Checked",
    value: true,
  }).view;
  const themedEl = themedHost.firstElementChild;
  const themedInd = themedEl.querySelector(".indicator");
  const aristo = getComputedStyle(document.documentElement);
  const rgb = (hex) => {
    const n = parseInt(hex.trim().slice(1), 16);
    return `rgb(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255})`;
  };

  check(
    "aristo declared the variables the checkbox reads",
    [
      "--accent-color",
      "--checkbox-indicator-background",
      "--checkbox-check-color",
      "--default-border-color",
      "--focus-ring",
      "--opacity-disable",
    ].every((name) => aristo.getPropertyValue(name).trim() !== ""),
  );
  check(
    "an unchecked indicator wears --checkbox-indicator-background",
    getComputedStyle(plainInd).backgroundColor ===
      rgb(aristo.getPropertyValue("--checkbox-indicator-background")),
  );
  check(
    "its border wears --default-border-color",
    getComputedStyle(plainInd).borderTopColor ===
      rgb(aristo.getPropertyValue("--default-border-color")),
  );
  // A ticked box is Aristo's default button — the pale sky face, with the
  // glyph darkened to carry against it. Neither colour is the component's
  // own: checkbox.css paints the accent behind a --checkbox-check-color
  // glyph, and the theme's rules overrule both. That they win here is what
  // says the whole theme is in effect and not just its variables.
  check(
    "a checked indicator wears the theme's --primary-background-color",
    getComputedStyle(themedInd).backgroundColor ===
      rgb(aristo.getPropertyValue("--primary-background-color")),
  );
  check(
    "and the check mark darkens to --checked-mark-color",
    getComputedStyle(themedEl.querySelector(".check")).borderRightColor ===
      rgb(aristo.getPropertyValue("--checked-mark-color")),
  );
  check(
    "a theme rule outscores the component stylesheet it restyles",
    getComputedStyle(themedInd).backgroundColor !==
      rgb(aristo.getPropertyValue("--accent-color")),
  );

  themed.enabled = false;
  check(
    "a disabled checkbox wears --opacity-disable",
    getComputedStyle(themedHost.firstElementChild).opacity ===
      aristo.getPropertyValue("--opacity-disable").trim(),
  );

  box.enabled = false;
  click(boxEl);
  check(
    "a disabled checkbox ignores a click",
    box.value === false && fired.length === 2,
  );
  check("and is out of the tab order", boxEl.getAttribute("tabindex") === "-1");

  // --- ComboBox, and the icon the compiler inlined ------------------------
  const comboHost = document.createElement("div");
  stage.appendChild(comboHost);
  const chosen = [];
  const combo = mount(ComboBox, comboHost, {
    value: "red",
    action: (control, value) => chosen.push(value),
    children: [
      h(Option, { text: "Red", value: "red" }),
      h(Option, { text: "Green", value: "green" }),
    ],
  }).view;
  const select = comboHost.querySelector("select");

  check("the combo drew a native select", select instanceof HTMLSelectElement);
  check("with an entry per Option", select.options.length === 2);
  check("and the value it was given", select.value === "red");

  select.value = "green";
  select.dispatchEvent(new Event("change", { bubbles: true }));
  check(
    "choosing an entry fires the action",
    chosen.length === 1 && chosen[0] === "green",
  );
  check("and the control reads back what was chosen", combo.value === "green");

  // `import ChevronDown from "svg:chevron-down"` — resolved at compile time
  // out of the framework's icons. What matters in a browser is that it is a
  // real SVG element: an <svg> made with createElement is an unknown HTML
  // element that paints nothing.
  const icon = comboHost.querySelector(".chevron svg");
  check("the icon was inlined by the compiler", icon !== null);
  check("in the SVG namespace, so it paints", icon instanceof SVGElement);
  check(
    "children of the icon too",
    icon.firstElementChild instanceof SVGElement,
  );
  check("and it has something to draw", icon.getBBox().width > 0);

  // --- lifecycle ----------------------------------------------------------
  // attached() runs with the node in the document, so it can measure.
  const seen = [];

  class Probe extends Component {
    attached() {
      seen.push([
        "attached",
        this.node.isConnected,
        this.node.getBoundingClientRect().width,
      ]);
    }

    detached() {
      seen.push(["detached"]);
    }

    draw() {
      return h("p", { style: { width: "40px" } }, "probe");
    }
  }

  const probeHost = document.createElement("div");
  stage.appendChild(probeHost);
  const probe = mount(Probe, probeHost, {});

  check("attached() ran with the node in the document", seen[0]?.[1] === true);
  check("attached() could measure the node", seen[0]?.[2] === 40);
  probe();
  check("detached() ran on unmount", seen[1]?.[0] === "detached");

  // --- cleanup ------------------------------------------------------------
  // A removed component must not keep listening; the browser is the only place
  // this can be proven against real event dispatch.
  let orphanClicks = 0;
  const orphanHost = document.createElement("div");
  stage.appendChild(orphanHost);
  const orphan = mount(Counter, orphanHost, {});
  const orphanButton = orphanHost.querySelectorAll("button")[1];

  click(orphanButton);
  const countedWhileMounted =
    orphanHost.querySelector("output").textContent === "1";
  check("mounted component responds", countedWhileMounted);

  orphan();
  orphanButton.addEventListener("click", () => (orphanClicks += 1));
  click(orphanButton);
  check(
    "unmounted component stops listening",
    orphanClicks === 1 && orphanHost.innerHTML === "",
  );

  document.querySelector("#results").textContent = log.join("\n");
  // Built at runtime so the verdict cannot be found in the page source itself.
  document.title = [
    "verdict",
    failed ? "FAIL" : "PASS",
    `(${log.length} checks)`,
  ].join(" ");
</script>
