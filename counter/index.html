<!doctype html>
<meta charset="utf-8" />
<title>Mosaic app</title>
<!-- Serve the repo root, then open /examples/ -->
<div id="app"></div>
<script type="module">
  import { MosaicApplication } from "../../src/js/runtime/mosaic.js";

  class AppController {
      constructor(props) {
          this.title = props.title;
      }
  }

  // The root is examples/main.ib, whose {title} binding reads this controller.
  // It renders <Counter/> — examples/Counter.js, a drawn View that owns itself.
  new MosaicApplication({ id: "app", controller: new AppController({title: "Counter App"}) });
</script>
